services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOTNET_INSTALL_VERSION: ${DOTNET_INSTALL_VERSION:-9.0.100}
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/DeliriumPulse/CardShopCoop
      RUNNER_SCOPE: repo
      RUNNER_NAME_PREFIX: cardshopcoop
      LABELS: linux,cardshop-game
      ACCESS_TOKEN: ${RUNNER_ACCESS_TOKEN}
      EPHEMERAL: "true"
      DISABLE_AUTO_UPDATE: "true"
      UNSET_CONFIG_VARS: "true"
      RUN_AS_ROOT: "false"
    volumes:
      - ../game:/game:ro
      - runner-nuget:/home/runner/.nuget

volumes:
  runner-nuget:
