name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    runs-on: [self-hosted, linux, cardshop-game]
    timeout-minutes: 30
    env:
      CARDSHOP_GAMEPATH: /game
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*<CardShopCoopVersion>\(.*\)<\/CardShopCoopVersion>.*/\1/p' Directory.Build.props)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid CardShopCoopVersion: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          base_version="${tag_version%%-*}"
          if [[ "$base_version" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Tag $tag_version does not match CardShopCoopVersion ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Build and package everything
        shell: bash
        run: bash scripts/build.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out first so the default clean does not wipe the downloaded dist/ afterwards. The
      # checkout provides the release scripts and the checkout git metadata `gh release create` needs.
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*<CardShopCoopVersion>\(.*\)<\/CardShopCoopVersion>.*/\1/p' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.x

      - name: Install Thunderstore CLI
        run: |
          dotnet tool install --global tcli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Stable tags go to Thunderstore; every tag creates the matching GitHub release (prerelease
      # for names with a "-suffix"). See scripts/publish.sh.
      - name: Publish release
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish.sh "${{ steps.version.outputs.version }}"

      # Nexus Mods uploads use the official action and a pre-created file group. Each is skipped
      # until the matching repository variable is configured: vars.NEXUSMODS_FILE_ID and
      # vars.NEXUSMODS_CUSTOMTV_FILE_ID (with the NEXUSMODS_API_KEY secret).
      - name: Publish core to Nexus Mods
        if: ${{ !contains(github.ref_name, '-') && vars.NEXUSMODS_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: dist/nexus/CardShopCoopCommunity-${{ steps.version.outputs.version }}.zip
          version: ${{ steps.version.outputs.version }}
          category: main
          display_name: CardShopCoopCommunity ${{ steps.version.outputs.version }}
          description: True co-op multiplayer for TCG Card Shop Simulator.

      - name: Publish Custom TV to Nexus Mods
        if: ${{ !contains(github.ref_name, '-') && vars.NEXUSMODS_CUSTOMTV_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_CUSTOMTV_FILE_ID }}
          filename: dist/nexus/CardShopCoopCommunity_CustomTv-${{ steps.version.outputs.version }}.zip
          version: ${{ steps.version.outputs.version }}
          category: main
          display_name: CardShopCoopCommunity Custom TV ${{ steps.version.outputs.version }}
          description: RTCGO Custom TV playback sync for CardShopCoopCommunity.
