name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      discord:
        description: Post the current changelog to Discord (tests the webhook; nothing else runs)
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.discord) }}
    runs-on: [self-hosted, linux, cardshop-game]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      api_version: ${{ steps.version.outputs.api_version }}
    env:
      CARDSHOP_GAMEPATH: /game
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*<CardShopCoopVersion>\(.*\)<\/CardShopCoopVersion>.*/\1/p' Directory.Build.props)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid CardShopCoopVersion: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          api_version=$(sed -n 's/.*<CardShopCoopApiVersion>\(.*\)<\/CardShopCoopApiVersion>.*/\1/p' Directory.Build.props)
          [[ "$api_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid CardShopCoopApiVersion: $api_version" >&2
            exit 1
          }
          echo "api_version=$api_version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          base_version="${tag_version%%-*}"
          if [[ "$base_version" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Tag $tag_version does not match CardShopCoopVersion ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Build and package everything
        shell: bash
        run: bash scripts/build.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # The three publish targets are independent jobs (each only needs the build), so a failure in one
  # never blocks the others.
  release-github:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-github.sh "${{ needs.build.outputs.version }}"

  release-thunderstore:
    name: Publish to Thunderstore
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.x

      - name: Install Thunderstore CLI
        run: |
          dotnet tool install --global tcli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: bash scripts/publish-thunderstore.sh "${{ needs.build.outputs.version }}"

  release-nexus:
    name: Publish to Nexus Mods
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # The "## <version>" section of CHANGELOG.md, published as each Nexus file version's changelog.
      # Its leading "## <version>" heading is stripped for Nexus: the file version already carries the
      # version, and the core file's description repeats it via its "Changelog for <version>:" label.
      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          text="$(bash scripts/changelog-extract.sh "${{ needs.build.outputs.version }}")"
          text="$(printf '%s\n' "$text" | tail -n +2)"
          {
            echo "text<<CHANGELOG_EOF"
            echo "$text"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Nexus Mods uploads use the official action and a pre-created file group. Each is skipped
      # until the matching repository variable is configured: vars.NEXUSMODS_FILE_ID,
      # vars.NEXUSMODS_INTEROP_FILE_ID, vars.NEXUSMODS_SAMPLE_FILE_ID (with the NEXUSMODS_API_KEY
      # secret). The per-version changelog needs vars.NEXUSMODS_MOD_ID.
      - name: Publish core to Nexus Mods
        if: ${{ vars.NEXUSMODS_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: dist/nexus/CardShopCoop.zip
          version: ${{ needs.build.outputs.version }}
          category: main
          display_name: CardShopCoop
          description: |
            The core files for the mod to operate.

            Changelog for ${{ needs.build.outputs.version }}:
            ${{ steps.changelog.outputs.text }}
          changelog: ${{ vars.NEXUSMODS_MOD_ID != '' && steps.changelog.outputs.text || '' }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}

      - name: Publish ExternalModInterop to Nexus Mods
        if: ${{ vars.NEXUSMODS_INTEROP_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_INTEROP_FILE_ID }}
          filename: dist/nexus/CardShopCoop.ExternalModInterop.zip
          version: ${{ needs.build.outputs.version }}
          category: optional
          display_name: CardShopCoop.ExternalModInterop
          description: |
            Compatibility layer for the following mods:
            - RTCGO Custom TV
            - Purchase Overhaul
          changelog: ${{ vars.NEXUSMODS_MOD_ID != '' && steps.changelog.outputs.text || '' }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}

      # Example-mod source as a Nexus "miscellaneous" file. Skipped until configured with
      # vars.NEXUSMODS_SAMPLE_FILE_ID.
      - name: Publish example-mod source to Nexus Mods
        if: ${{ vars.NEXUSMODS_SAMPLE_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_SAMPLE_FILE_ID }}
          filename: dist/CardShopCoop.SampleMod.zip
          version: ${{ needs.build.outputs.api_version }}
          category: miscellaneous
          display_name: CardShopCoop.SampleMod
          description: A template showing how other mods can integrate with CardShopCoop's co-op layer.
          changelog: ${{ vars.NEXUSMODS_MOD_ID != '' && steps.changelog.outputs.text || '' }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}

  release-discord:
    name: Post changelog to Discord
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.discord) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Posts the "## <version>" changelog for every v* tag (alphas/betas too), or on a manual
      # "discord" dispatch. Skipped when the secret is unset.
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/publish-discord.sh
